# Monitoraggio locale: Grafana in container.
# L'app FastAPI gira separatamente con uvicorn sulla porta 8000.
# Grafana interroga l'app tramite il plugin Infinity.
# Fonte dati e dashboard sono caricate automaticamente dal provisioning.
# Avvio:  docker compose up
# Stop:   docker compose down

services:
  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
      - ./dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json

volumes:
  grafana-storage: {}
